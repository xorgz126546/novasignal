# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo/branch.
# Creates a PostgreSQL database and one web service (API + dashboard on the same URL).
databases:
  - name: cryptonex-db
    plan: free            # free Postgres expires after 30 days on Render — upgrade to "basic-256mb" for the 30-day test
    region: frankfurt
    databaseName: cryptonex
    user: cryptonex

services:
  - type: web
    name: cryptonex-ai
    runtime: docker
    plan: starter         # needs to stay awake for the scheduler; the free plan sleeps after 15 min idle
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: cryptonex-db, property: connectionString }
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: BINANCE_BASE_URL
        value: https://data-api.binance.vision
      - key: BILLING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: TELEGRAM_BOT_TOKEN
        sync: false       # Render asks you for this value when you create the Blueprint
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
