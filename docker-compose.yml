# Production-like local stack: PostgreSQL + API (with scheduler) + web (nginx serving the SPA and proxying /api).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cryptonex
      POSTGRES_USER: cryptonex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cryptonex"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cryptonex:${POSTGRES_PASSWORD}@db:5432/cryptonex
      ENABLE_SCHEDULER: "true"
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
